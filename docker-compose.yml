services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Ollama__BaseUrl=http://host.docker.internal:11434
      - ConnectionStrings__Default=${POSTGRES_CONNECTION_STRING:-Host=localhost;Database=cdphysio;Username=postgres;Password=postgres}
      - Reviews__AdminKey=${REVIEWS_ADMIN_KEY:-change-me-in-production}
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
