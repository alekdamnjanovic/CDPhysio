services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=${POSTGRES_CONNECTION_STRING:-Host=localhost;Database=cdphysio;Username=postgres;Password=postgres}
      - Reviews__AdminKey=${REVIEWS_ADMIN_KEY:-change-me-in-production}
      - Ai__BaseUrl=${AI_BASE_URL:-https://api.groq.com/openai/v1}
      - Ai__Model=${AI_MODEL:-llama-3.3-70b-versatile}
      - Ai__ApiKey=${AI_API_KEY:-}
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
