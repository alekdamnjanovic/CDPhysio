<button
  class="back-to-top"
  [class.visible]="isVisible()"
  type="button"
  aria-label="Back to top"
  (click)="scrollToTop()"
>
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</button>
